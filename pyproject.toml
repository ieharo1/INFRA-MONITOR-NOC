[tool.poetry]
name = "vibe-coding"
version = "0.1.0"
description = "Sistema de gestión y monitoreo de infraestructura TI con Django."
authors = ["Isaac Esteban Haro Torres <zackharo1@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
django = "^5.1.6"
gunicorn = "^22.0.0"
psycopg2-binary = "^2.9.9"
celery = "^5.3.6"
redis = "^5.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.1"
black = "^24.2.0"
ruff = "^0.2.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
